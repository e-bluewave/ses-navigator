openapi: 3.1.0
info:
  title: SES Navigator API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /companies:
    post:
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listCompanies
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/CompanyStatus' },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Company list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{id}:
    delete:
      operationId: deleteCompany
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyDeleteInput' }
      responses:
        '204': { description: Company soft-deleted and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    put:
      operationId: updateCompany
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '200':
          description: Company updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getCompany
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /companies/{id}/audit:
    get:
      operationId: listCompanyAudit
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Company audit event summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyAuditList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts:
    post:
      operationId: createCompanyContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyContactInput' }
      responses:
        '201':
          description: Company contact created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listCompanyContacts
      parameters:
        - { name: companyId, in: query, schema: { type: string, format: uuid } }
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/ContactStatus' },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Company contact list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyContactList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /contacts/{id}:
    delete:
      operationId: deleteCompanyContact
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyContactDeleteInput' }
      responses:
        '204': { description: Company contact soft-deleted and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    put:
      operationId: updateCompanyContact
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyContactInput' }
      responses:
        '200':
          description: Company contact updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getCompanyContact
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Company contact detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyContact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contacts/{id}/audit:
    get:
      operationId: listCompanyContactAudit
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Company contact audit event summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyContactAuditList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/context:
    get:
      operationId: getAuthContext
      responses:
        '200':
          description: Authentication and MFA policy context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Project created
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Project' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listProjects
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: recruitmentStatus,
            in: query,
            schema: { $ref: '#/components/schemas/RecruitmentStatus' },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/ProjectStatus' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}:
    delete:
      operationId: deleteProject
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectDeleteInput' }
      responses:
        '204': { description: Project soft-deleted and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    put:
      operationId: updateProject
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ProjectInput' } },
          }
      responses:
        '200':
          {
            description: Project updated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Project' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getProject
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/audit:
    get:
      operationId: listProjectAudit
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Project audit event summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAuditList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CompanyStatus: { type: string, enum: [prospect, active, inactive, blocked] }
    ContactStatus:
      { type: string, enum: [active, inactive, left_company, unknown] }
    CompanyContact:
      type: object
      required:
        [
          id,
          companyId,
          managementNo,
          familyName,
          givenName,
          departmentName,
          positionTitle,
          email,
          phone,
          mobilePhone,
          isPrimary,
          status,
          updatedAt,
          rowVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        managementNo: { type: string }
        familyName: { type: string }
        givenName: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
        positionTitle: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        mobilePhone: { type: [string, 'null'] }
        isPrimary: { type: boolean }
        status: { $ref: '#/components/schemas/ContactStatus' }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    CompanyContactInput:
      type: object
      required:
        [
          companyId,
          managementNo,
          familyName,
          givenName,
          departmentName,
          positionTitle,
          email,
          phone,
          mobilePhone,
          isPrimary,
          status,
        ]
      properties:
        companyId: { type: string, format: uuid }
        managementNo: { type: string, minLength: 1, maxLength: 32 }
        familyName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: [string, 'null'], maxLength: 100 }
        departmentName: { type: [string, 'null'], maxLength: 200 }
        positionTitle: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], maxLength: 50 }
        mobilePhone: { type: [string, 'null'], maxLength: 50 }
        isPrimary: { type: boolean }
        status: { $ref: '#/components/schemas/ContactStatus' }
    CompanyContactList:
      type: object
      required: [items, page]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/CompanyContact' },
          }
        page:
          type: object
          required: [limit, nextCursor]
          properties:
            limit: { type: integer }
            nextCursor: { type: ['string', 'null'] }
    Company:
      type: object
      required:
        [
          id,
          managementNo,
          legalName,
          displayName,
          corporateNumber,
          postalCode,
          prefecture,
          city,
          addressLine,
          websiteUrl,
          representativeName,
          status,
          updatedAt,
          rowVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        managementNo: { type: string }
        legalName: { type: string }
        displayName: { type: [string, 'null'] }
        corporateNumber: { type: [string, 'null'] }
        postalCode: { type: [string, 'null'] }
        prefecture: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        websiteUrl: { type: [string, 'null'], format: uri }
        representativeName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/CompanyStatus' }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    CompanyInput:
      type: object
      required:
        [
          managementNo,
          legalName,
          displayName,
          corporateNumber,
          postalCode,
          prefecture,
          city,
          addressLine,
          websiteUrl,
          representativeName,
          status,
        ]
      properties:
        managementNo: { type: string, minLength: 1, maxLength: 32 }
        legalName: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: [string, 'null'], maxLength: 200 }
        corporateNumber: { type: [string, 'null'], pattern: '^[0-9]{13}$' }
        postalCode: { type: [string, 'null'], maxLength: 8 }
        prefecture: { type: [string, 'null'], maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 100 }
        addressLine: { type: [string, 'null'], maxLength: 500 }
        websiteUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        representativeName: { type: [string, 'null'], maxLength: 200 }
        status: { $ref: '#/components/schemas/CompanyStatus' }
    CompanyDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CompanyAuditEvent:
      type: object
      required: [id, occurredAt, actorUserId, action, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        requestId: { type: [string, 'null'] }
    CompanyAuditList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/CompanyAuditEvent' },
          }
    CompanyContactDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CompanyContactAuditEvent:
      type: object
      required: [id, occurredAt, actorUserId, action, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        requestId: { type: [string, 'null'] }
    CompanyContactAuditList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/CompanyContactAuditEvent' },
          }
    CompanyList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Company' } }
        page:
          type: object
          required: [limit, nextCursor]
          properties:
            limit: { type: integer }
            nextCursor: { type: ['string', 'null'] }
    AuthContext:
      type: object
      required: [requiresMfa]
      properties:
        requiresMfa: { type: boolean }
    ProjectStatus:
      { type: string, enum: [draft, open, on_hold, closed, cancelled] }
    RecruitmentStatus:
      { type: string, enum: [recruiting, paused, filled, ended] }
    Project:
      type: object
      required:
        [
          id,
          managementNo,
          projectName,
          summary,
          projectStatus,
          recruitmentStatus,
          plannedStartOn,
          plannedEndOn,
          updatedAt,
          rowVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        managementNo: { type: string }
        projectName: { type: string }
        summary: { type: [string, 'null'] }
        projectStatus: { $ref: '#/components/schemas/ProjectStatus' }
        recruitmentStatus: { $ref: '#/components/schemas/RecruitmentStatus' }
        plannedStartOn: { type: [string, 'null'], format: date }
        plannedEndOn: { type: [string, 'null'], format: date }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    ProjectInput:
      type: object
      required: [managementNo, projectName, projectStatus, recruitmentStatus]
      properties:
        managementNo: { type: string, minLength: 1, maxLength: 32 }
        projectName: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: [string, 'null'], maxLength: 4000 }
        projectStatus: { $ref: '#/components/schemas/ProjectStatus' }
        recruitmentStatus: { $ref: '#/components/schemas/RecruitmentStatus' }
        plannedStartOn: { type: [string, 'null'], format: date }
        plannedEndOn: { type: [string, 'null'], format: date }
    ProjectDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ProjectAuditEvent:
      type: object
      required: [id, occurredAt, actorUserId, action, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        requestId: { type: [string, 'null'] }
    ProjectAuditList:
      type: object
      required: [items]
      properties:
        items:
          {
            type: array,
            items: { $ref: '#/components/schemas/ProjectAuditEvent' },
          }
    ProjectList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        page:
          type: object
          required: [limit, nextCursor]
          properties:
            limit: { type: integer }
            nextCursor: { type: ['string', 'null'] }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    BadRequest:
      {
        description: Invalid request,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Conflict:
      {
        description: Optimistic locking conflict,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    PreconditionRequired:
      {
        description: If-Match is required,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Forbidden:
      {
        description: Permission denied,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    NotFound:
      {
        description: Not found or not visible,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
