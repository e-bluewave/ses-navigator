components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    EngineerStatus:
      { type: string, enum: [candidate, active, inactive, retired, blocked] }
    AvailabilityStatus:
      {
        type: string,
        enum: [unknown, available, proposed, engaged, unavailable],
      }
    Engineer:
      type: object
      required:
        [
          id,
          managementNo,
          familyName,
          givenName,
          displayName,
          status,
          availabilityStatus,
          availableFrom,
          nearestStation,
          summary,
          updatedAt,
          rowVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        managementNo: { type: string }
        familyName: { type: string }
        givenName: { type: string }
        displayName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/EngineerStatus' }
        availabilityStatus: { $ref: '#/components/schemas/AvailabilityStatus' }
        availableFrom: { type: [string, 'null'], format: date }
        nearestStation: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    EngineerList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Engineer' } }
        page: { $ref: '#/components/schemas/Page' }
    EngineerInput:
      type: object
      required:
        [
          managementNo,
          familyName,
          givenName,
          displayName,
          status,
          availabilityStatus,
          availableFrom,
          nearestStation,
          summary,
        ]
      properties:
        managementNo: { type: string, minLength: 1, maxLength: 32 }
        familyName: { type: string, minLength: 1, maxLength: 100 }
        givenName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: [string, 'null'], maxLength: 200 }
        status: { $ref: '#/components/schemas/EngineerStatus' }
        availabilityStatus: { $ref: '#/components/schemas/AvailabilityStatus' }
        availableFrom: { type: [string, 'null'], format: date }
        nearestStation: { type: [string, 'null'], maxLength: 200 }
        summary: { type: [string, 'null'], maxLength: 2000 }
    EngineerDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    EngineerAuditEvent:
      type: object
      required: [id, occurredAt, actorUserId, action, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        requestId: { type: [string, 'null'] }
    EngineerAuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EngineerAuditEvent' }
    EngineerGender: { type: string, enum: [male, female, other, undisclosed] }
    EngineerPrivateInput:
      type: object
      required:
        [
          birthDate,
          gender,
          personalEmail,
          phone,
          postalCode,
          prefecture,
          city,
          addressLine,
          emergencyContact,
          notes,
        ]
      properties:
        birthDate: { type: [string, 'null'], format: date }
        gender:
          {
            anyOf:
              [
                { $ref: '#/components/schemas/EngineerGender' },
                { type: 'null' },
              ],
          }
        personalEmail: { type: [string, 'null'], format: email, maxLength: 320 }
        phone: { type: [string, 'null'], maxLength: 50 }
        postalCode: { type: [string, 'null'], maxLength: 8 }
        prefecture: { type: [string, 'null'], maxLength: 100 }
        city: { type: [string, 'null'], maxLength: 200 }
        addressLine: { type: [string, 'null'], maxLength: 500 }
        emergencyContact: { type: [string, 'null'], maxLength: 500 }
        notes: { type: [string, 'null'], maxLength: 2000 }
    EngineerPrivateDetail:
      allOf:
        - { $ref: '#/components/schemas/EngineerPrivateInput' }
        - type: object
          required: [engineerId, updatedAt, rowVersion]
          properties:
            engineerId: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
            rowVersion: { type: integer, minimum: 1 }
    EngineerAffiliationType:
      {
        type: string,
        enum: [employee, freelance, partner_employee, subcontractor, other],
      }
    EngineerAffiliationInput:
      type: object
      required:
        [
          companyId,
          affiliationType,
          contractType,
          startDate,
          endDate,
          isPrimary,
          notes,
        ]
      properties:
        companyId: { type: string, format: uuid }
        affiliationType:
          { $ref: '#/components/schemas/EngineerAffiliationType' }
        contractType: { type: [string, 'null'], maxLength: 100 }
        startDate: { type: string, format: date }
        endDate: { type: [string, 'null'], format: date }
        isPrimary: { type: boolean }
        notes: { type: [string, 'null'], maxLength: 2000 }
    EngineerAffiliation:
      allOf:
        - { $ref: '#/components/schemas/EngineerAffiliationInput' }
        - type: object
          required: [id, engineerId, updatedAt, rowVersion]
