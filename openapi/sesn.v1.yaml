openapi: 3.1.0
info:
  title: SES Navigator API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/context:
    get:
      operationId: getAuthContext
      responses:
        '200':
          description: Authentication and MFA policy context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Project created
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Project' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      operationId: listProjects
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: recruitmentStatus,
            in: query,
            schema: { $ref: '#/components/schemas/RecruitmentStatus' },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/ProjectStatus' },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /projects/{id}:
    delete:
      operationId: deleteProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectDeleteInput' }
      responses:
        '204': { description: Project soft-deleted and audited }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    put:
      operationId: updateProject
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ProjectInput' } },
          }
      responses:
        '200':
          {
            description: Project updated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/Project' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getProject
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{id}/audit:
    get:
      operationId: listProjectAudit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Project audit event summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAuditList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AuthContext:
      type: object
      required: [requiresMfa]
      properties:
        requiresMfa: { type: boolean }
    ProjectStatus:
      { type: string, enum: [draft, open, on_hold, closed, cancelled] }
    RecruitmentStatus:
      { type: string, enum: [recruiting, paused, filled, ended] }
    Project:
      type: object
      required:
        [
          id,
          managementNo,
          projectName,
          summary,
          projectStatus,
          recruitmentStatus,
          plannedStartOn,
          plannedEndOn,
          updatedAt,
          rowVersion,
        ]
      properties:
        id: { type: string, format: uuid }
        managementNo: { type: string }
        projectName: { type: string }
        summary: { type: [string, 'null'] }
        projectStatus: { $ref: '#/components/schemas/ProjectStatus' }
        recruitmentStatus: { $ref: '#/components/schemas/RecruitmentStatus' }
        plannedStartOn: { type: [string, 'null'], format: date }
        plannedEndOn: { type: [string, 'null'], format: date }
        updatedAt: { type: string, format: date-time }
        rowVersion: { type: integer, minimum: 1 }
    ProjectInput:
      type: object
      required: [managementNo, projectName, projectStatus, recruitmentStatus]
      properties:
        managementNo: { type: string, minLength: 1, maxLength: 32 }
        projectName: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: [string, 'null'], maxLength: 4000 }
        projectStatus: { $ref: '#/components/schemas/ProjectStatus' }
        recruitmentStatus: { $ref: '#/components/schemas/RecruitmentStatus' }
        plannedStartOn: { type: [string, 'null'], format: date }
        plannedEndOn: { type: [string, 'null'], format: date }
    ProjectDeleteInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ProjectAuditEvent:
      type: object
      required: [id, occurredAt, actorUserId, action, requestId]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        requestId: { type: [string, 'null'] }
    ProjectAuditList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectAuditEvent' } }
    ProjectList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        page:
          type: object
          required: [limit, nextCursor]
          properties:
            limit: { type: integer }
            nextCursor: { type: ['string', 'null'] }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  responses:
    BadRequest:
      {
        description: Invalid request,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Conflict:
      {
        description: Optimistic locking conflict,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    PreconditionRequired:
      {
        description: If-Match is required,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    Forbidden:
      {
        description: Permission denied,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
    NotFound:
      {
        description: Not found or not visible,
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ApiError' } },
          },
      }
