openapi: 3.1.0
info:
  title: SES Navigator API
  version: 0.1.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /sales-kpi:
    get:
      operationId: getSalesKpiDashboard
      parameters:
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: contractExpiryDays, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 60 } }
      responses:
        '200':
          description: Access-scoped sales KPI dashboard
          content: { application/json: { schema: { $ref: '#/components/schemas/SalesKpiDashboard' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /profitability:
    get:
      operationId: getProfitabilityDashboard
      parameters:
        - {
            name: fromMonth,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - {
            name: toMonth,
            in: query,
            required: true,
            schema: { type: string, format: date },
          }
        - {
            name: currency,
            in: query,
            schema: { type: string, pattern: '^[A-Z]{3}$', default: JPY },
          }
      responses:
        '200':
          description: Currency-safe profitability dashboard
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: '#/components/schemas/ProfitabilityDashboard' },
                },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /expenses:
    get:
      operationId: listExpenses
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/ExpenseStatus' },
          }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Authorized expense list
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ExpenseList' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ExpenseInput' } },
          }
      responses:
        '201':
          description: Expense draft created
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Expense' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /expenses/{id}:
    get:
      operationId: getExpense
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Expense detail with approval history
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Expense' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateExpense
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ExpenseInput' } },
          }
      responses:
        '200':
          description: Expense draft updated
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Expense' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /expenses/{id}/status:
    post:
      operationId: transitionExpenseStatus
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  { $ref: '#/components/schemas/ExpenseStatusTransitionInput' },
              },
          }
      responses:
        '200':
          description: Expense status transitioned
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/Expense' } },
            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /accounting-exports:
    get:
      operationId: listAccountingExports
      parameters:
        - {
            name: accountingPeriodId,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Authorized accounting export batch list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExportList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: generateAccountingExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/AccountingExportGenerateInput' }
      responses:
        '201':
          description: Versioned accounting export batch generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExportBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounting-exports/{id}:
    get:
      operationId: getAccountingExport
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Accounting export batch with journal lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExportBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /accounting-exports/{id}/exported:
    post:
      operationId: markAccountingExported
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/AccountingExportCompletionInput' }
      responses:
        '200':
          description: Accounting export batch marked exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingExportBatch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /accounting-periods:
    get:
      operationId: listAccountingPeriods
      parameters:
        - { name: fromMonth, in: query, schema: { type: string, format: date } }
        - { name: toMonth, in: query, schema: { type: string, format: date } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 120, default: 24 },
          }
      responses:
        '200':
          description: Authorized accounting period list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriodList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAccountingPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingPeriodInput' }
      responses:
        '201':
          description: Accounting period created or returned idempotently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /accounting-periods/{id}:
    get:
      operationId: getAccountingPeriod
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Accounting period with close history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /accounting-periods/{id}/status:
    post:
      operationId: transitionAccountingPeriodStatus
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/AccountingPeriodTransitionInput' }
      responses:
        '200':
          description: Accounting close status transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountingPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /invoices:
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Invoice draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listInvoices
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/InvoiceStatus' },
          }
        - {
            name: invoiceType,
            in: query,
            schema: { $ref: '#/components/schemas/InvoiceType' },
          }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Authorized invoice summary list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices/{id}:
    put:
      operationId: updateInvoice
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '200':
          description: Invoice draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getInvoice
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Authorized invoice detail with line items and payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/options:
    get:
      operationId: getInvoiceOptions
      responses:
        '200':
          description: Authorized billing-account form options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invoices/{id}/status:
    post:
      operationId: transitionInvoiceStatus
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/InvoiceStatusTransitionInput' }
      responses:
        '200':
          description: Invoice lifecycle status transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /invoices/{id}/payments:
    post:
      operationId: registerInvoicePayment
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentInput' }
      responses:
        '200':
          description: Payment registered and invoice settlement recalculated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /invoices/{id}/payments/{paymentId}/reversal:
    post:
      operationId: reverseInvoicePayment
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: paymentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePaymentReversalInput' }
      responses:
        '200':
          description: Payment reversed and invoice settlement recalculated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /work-logs:
    post:
      operationId: createWorkLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkLogInput' }
      responses:
        '201':
          description: Monthly work-log draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listWorkLogs
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/WorkLogStatus' },
          }
        - { name: workMonth, in: query, schema: { type: string, format: date } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Authorized monthly work-log summary list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLogList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /work-logs/{id}:
    put:
      operationId: updateWorkLog
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkLogInput' }
      responses:
        '200':
          description: Monthly work-log draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    get:
      operationId: getWorkLog
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Authorized monthly work-log detail with daily records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /work-logs/{id}/status:
    post:
      operationId: transitionWorkLogStatus
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/WorkLogStatusTransitionInput' }
      responses:
        '200':
          description: Monthly work-log status transitioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /engagements:
    post:
      operationId: createEngagement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngagementInput' }
      responses:
        '201':
          description: Manual engagement draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Engagement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listEngagements
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, minLength: 1, maxLength: 100 },
          }
        - {
            name: status,
            in: query,
            schema: { $ref: '#/components/schemas/EngagementStatus' },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Authorized engagement summary list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngagementList' }
        '400': { $ref: '#/components/responses/BadRequest' }
