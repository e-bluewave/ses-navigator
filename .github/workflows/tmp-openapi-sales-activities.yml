name: Temporary update sales activity OpenAPI

on:
  push:
    branches:
      - codex/issue-155-sales-activities
    paths:
      - .github/workflows/tmp-openapi-sales-activities.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-155-sales-activities
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Insert fail-closed OpenAPI definitions
        run: python .github/scripts/tmp_update_sales_activity_openapi.py
      - run: pnpm client:generate
      - run: pnpm exec prettier --write openapi/sesn.v1.yaml apps/web/src/api/generated.ts
      - name: Commit OpenAPI and generated client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/sesn.v1.yaml apps/web/src/api/generated.ts
          git diff --cached --check
          git commit -m "Document sales activity API"
          git push origin HEAD:codex/issue-155-sales-activities
