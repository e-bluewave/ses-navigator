name: Restore Evidence Assembler Temporary Verify

on:
  push:
    branches:
      - feature/restore-evidence-assembler

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-evidence-assembler
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/temp-restore-runtime-patch.cjs
      - run: >-
          pnpm exec prettier --write
          scripts/restore-drill-local-run.mjs
          scripts/restore-drill-local-run.test.mjs
      - run: node --test scripts/restore-drill-local-run.test.mjs
      - run: node --test scripts/restore-drill-local-db-restore.test.mjs
      - run: node --test scripts/restore-drill-local-storage-restore.test.mjs
      - name: Commit verified implementation
        shell: bash
        run: |
          git add scripts/restore-drill-local-run.mjs scripts/restore-drill-local-run.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add restore runtime safety preflight"
          git push origin HEAD:feature/restore-evidence-assembler
