name: Restore Evidence Assembler Temporary Verify

on:
  push:
    branches:
      - feature/restore-evidence-assembler

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-evidence-assembler
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add runtime safety preflight
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'scripts/restore-drill-local-run.mjs';
          let source = fs.readFileSync(sourcePath, 'utf8');

          const constantsAnchor = `const minuteMilliseconds = 60_000;
          const tierTargets = {`;
          if (!source.includes(constantsAnchor)) throw new Error('constants anchor missing');
          source = source.replace(
            constantsAnchor,
            `const minuteMilliseconds = 60_000;
          const loopbackHosts = new Set(['127.0.0.1', 'localhost', '::1', '[::1]']);
          const requiredRuntimeVariables = [
            'SESN_RESTORE_STORAGE_URL',
            'SESN_RESTORE_STORAGE_SERVICE_ROLE_KEY',
            'SESN_SUPABASE_URL',
            'SESN_SUPABASE_PUBLISHABLE_KEY',
            'SESN_SUPABASE_SECRET_KEY',
            'SESN_TEST_EMAIL',
            'SESN_TEST_PASSWORD',
            'SESN_TEST_USER_A_EMAIL',
            'SESN_TEST_USER_A_PASSWORD',
            'SESN_TEST_USER_B_EMAIL',
            'SESN_TEST_USER_B_PASSWORD',
          ];
          const tierTargets = {`,
          );

          const timelineAnchor = `export function calculateRestoreTimeline({`;
          if (!source.includes(timelineAnchor)) throw new Error('timeline anchor missing');
          source = source.replace(
            timelineAnchor,
            `export function validateLocalRestoreRuntimeEnvironment(env = {}) {
            const findings = [];
            for (const name of requiredRuntimeVariables) {
              if (!nonBlankString(env[name])) findings.push(\`missing-runtime-variable:\${name}\`);
            }
            if (findings.length > 0) {
              return {
                status: 'LOCAL_RESTORE_RUNTIME_ENV_FAILED',
                complete: false,
                findings,
              };
            }

            const supabaseUrl = parseLoopbackUrl(env.SESN_SUPABASE_URL, 'SESN_SUPABASE_URL', findings);
            const storageUrl = parseLoopbackUrl(
              env.SESN_RESTORE_STORAGE_URL,
              'SESN_RESTORE_STORAGE_URL',
              findings,
            );
            if (supabaseUrl && storageUrl && supabaseUrl.origin !== storageUrl.origin) {
              findings.push('storage-and-supabase-origin-must-match');
            }
            if (env.SESN_SUPABASE_SECRET_KEY.startsWith('sb_publishable_')) {
              findings.push('supabase-secret-key-must-not-be-publishable');
            }

            return {
              status:
                findings.length === 0
                  ? 'LOCAL_RESTORE_RUNTIME_ENV_PASSED'
                  : 'LOCAL_RESTORE_RUNTIME_ENV_FAILED',
              complete: findings.length === 0,
              findings,
            };
          }

          ${timelineAnchor}`,
          );

          const factsAnchor = `  if (!factsResult.complete) {
            throw new Error(
              \`Local restore run facts failed (\${factsResult.findings.length})\`,
            );
          }

          const repoRoot = resolve(facts.repoRoot ?? '.');`;
          if (!source.includes(factsAnchor)) throw new Error('facts runtime anchor missing');
          source = source.replace(
            factsAnchor,
            `  if (!factsResult.complete) {
            throw new Error(
              \`Local restore run facts failed (\${factsResult.findings.length})\`,
            );
          }
          const runtimeResult = validateLocalRestoreRuntimeEnvironment(env);
          if (!runtimeResult.complete) {
            throw new Error(
              \`Local restore runtime preflight failed (\${runtimeResult.findings.length})\`,
            );
          }

          const repoRoot = resolve(facts.repoRoot ?? '.');`,
          );

          const apiEnvAnchor = `        SUPABASE_URL: env.SUPABASE_URL ?? env.SESN_SUPABASE_URL,
              SUPABASE_ANON_KEY:
                env.SUPABASE_ANON_KEY ?? env.SESN_SUPABASE_PUBLISHABLE_KEY,`;
          if (!source.includes(apiEnvAnchor)) throw new Error('API env anchor missing');
          source = source.replace(
            apiEnvAnchor,
            `        SUPABASE_URL: env.SESN_SUPABASE_URL,
              SUPABASE_ANON_KEY: env.SESN_SUPABASE_PUBLISHABLE_KEY,`,
          );

          const helperAnchor = `function buildEvidenceNotes(userNotes) {`;
          if (!source.includes(helperAnchor)) throw new Error('helper anchor missing');
          source = source.replace(
            helperAnchor,
            `function parseLoopbackUrl(value, field, findings) {
            try {
              const url = new URL(value);
              if (!['http:', 'https:'].includes(url.protocol)) {
                findings.push(\`\${field}-must-use-http-or-https\`);
                return null;
              }
              if (!loopbackHosts.has(url.hostname)) {
                findings.push(\`\${field}-must-be-loopback\`);
                return null;
              }
              return url;
            } catch {
              findings.push(\`\${field}-must-be-valid-url\`);
              return null;
            }
          }

          ${helperAnchor}`,
          );
          fs.writeFileSync(sourcePath, source);

          const testPath = 'scripts/restore-drill-local-run.test.mjs';
          let tests = fs.readFileSync(testPath, 'utf8');
          const importAnchor = `  runLocalRestoreDrill,
            validateLocalRestoreRunFacts,`;
          if (!tests.includes(importAnchor)) throw new Error('test import anchor missing');
          tests = tests.replace(
            importAnchor,
            `  runLocalRestoreDrill,
            validateLocalRestoreRunFacts,
            validateLocalRestoreRuntimeEnvironment,`,
          );

          const timelineTestAnchor = `test('timeline chooses the older DB/Storage point and stops RTO at business usability', () => {`;
          if (!tests.includes(timelineTestAnchor)) throw new Error('test insertion anchor missing');
          tests = tests.replace(
            timelineTestAnchor,
            `test('runtime preflight rejects remote or mismatched Supabase and Storage targets', () => {
            assert.equal(validateLocalRestoreRuntimeEnvironment(baseRuntimeEnv()).complete, true);

            const remote = validateLocalRestoreRuntimeEnvironment({
              ...baseRuntimeEnv(),
              SESN_SUPABASE_URL: 'https://example.com',
            });
            assert.equal(remote.complete, false);
            assert.ok(remote.findings.includes('SESN_SUPABASE_URL-must-be-loopback'));

            const mismatch = validateLocalRestoreRuntimeEnvironment({
              ...baseRuntimeEnv(),
              SESN_RESTORE_STORAGE_URL: 'http://127.0.0.1:54322',
            });
            assert.equal(mismatch.complete, false);
            assert.ok(mismatch.findings.includes('storage-and-supabase-origin-must-match'));
          });

          ${timelineTestAnchor}`,
          );

          const orchestrationAnchor = `    outputPath: 'private-evidence.json',
              readFileImpl: async () => JSON.stringify(facts),`;
          if (!tests.includes(orchestrationAnchor)) throw new Error('orchestration env anchor missing');
          tests = tests.replace(
            orchestrationAnchor,
            `    outputPath: 'private-evidence.json',
              env: baseRuntimeEnv(),
              readFileImpl: async () => JSON.stringify(facts),`,
          );

          const helperTestAnchor = `function baseFacts() {`;
          if (!tests.includes(helperTestAnchor)) throw new Error('test helper anchor missing');
          tests = tests.replace(
            helperTestAnchor,
            `function baseRuntimeEnv() {
            return {
              SESN_RESTORE_STORAGE_URL: 'http://127.0.0.1:54321',
              SESN_RESTORE_STORAGE_SERVICE_ROLE_KEY: 'local-service-role-test',
              SESN_SUPABASE_URL: 'http://127.0.0.1:54321',
              SESN_SUPABASE_PUBLISHABLE_KEY: 'local-publishable-test',
              SESN_SUPABASE_SECRET_KEY: 'local-secret-test',
              SESN_TEST_EMAIL: 'test-user-a@example.test',
              SESN_TEST_PASSWORD: 'local-test-password',
              SESN_TEST_USER_A_EMAIL: 'test-user-a@example.test',
              SESN_TEST_USER_A_PASSWORD: 'local-test-password',
              SESN_TEST_USER_B_EMAIL: 'test-user-b@example.test',
              SESN_TEST_USER_B_PASSWORD: 'local-test-password',
            };
          }

          ${helperTestAnchor}`,
          );
          fs.writeFileSync(testPath, tests);
          NODE
      - run: >-
          pnpm exec prettier --write
          scripts/restore-drill-local-run.mjs
          scripts/restore-drill-local-run.test.mjs
      - run: node --test scripts/restore-drill-local-run.test.mjs
      - run: node --test scripts/restore-drill-local-db-restore.test.mjs
      - run: node --test scripts/restore-drill-local-storage-restore.test.mjs
      - name: Commit verified implementation
        shell: bash
        run: |
          git add scripts/restore-drill-local-run.mjs scripts/restore-drill-local-run.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add restore runtime safety preflight"
          git push origin HEAD:feature/restore-evidence-assembler
