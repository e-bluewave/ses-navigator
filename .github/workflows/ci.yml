name: CI

on:
  pull_request:
  push:
    branches: [Main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prettier --write scripts/check-long-running-processing-evidence.mjs scripts/check-long-running-processing-evidence.test.mjs && git diff -- scripts/check-long-running-processing-evidence.mjs scripts/check-long-running-processing-evidence.test.mjs && false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm cli:entry:check
      - run: pnpm smoke:auth-project:check
      - run: pnpm smoke:auth-lifecycle:check
      - run: pnpm release:readiness
      - run: pnpm release:readiness:check
      - run: pnpm security:data-api:check
      - run: pnpm security:data-api-writes
      - run: pnpm security:data-api-writes:check
      - run: pnpm security:data-api-rpcs
      - run: pnpm security:data-api-rpcs:check
      - run: pnpm security:data-api-routing
      - run: pnpm security:data-api-routing:check
      - run: pnpm security:data-api-runtime:check
      - run: pnpm security:data-api-sensitive
      - run: pnpm security:data-api-sensitive:check
      - run: pnpm security:data-api:all:check
      - run: pnpm security:client-secrets:check
      - run: pnpm security:data-migration
      - run: pnpm security:data-migration:check
      - run: node --test scripts/check-data-migration-evidence.test.mjs
      - run: pnpm security:db-backup
      - run: pnpm security:db-backup:check
      - run: pnpm security:db-backup-evidence:check
      - run: pnpm security:db-connectivity
      - run: pnpm security:db-connectivity:check
      - run: pnpm security:region-connectivity-evidence:check
      - run: pnpm security:env-separation
      - run: pnpm security:env-separation:check
      - run: pnpm security:env-separation-evidence:check
      - run: pnpm security:file-malware-scanning
      - run: pnpm security:file-malware-scanning:check
      - run: pnpm security:finance
      - run: pnpm security:finance:check
      - run: node --test scripts/check-finance-evidence.test.mjs
      - run: pnpm security:load-test
      - run: pnpm security:load-test:check
      - run: pnpm security:long-running-processing
      - run: pnpm security:long-running-processing:check
      - run: node --test scripts/check-long-running-processing-evidence.test.mjs
      - run: pnpm security:monitoring
      - run: pnpm security:monitoring:check
      - run: node --test scripts/check-monitoring-evidence.test.mjs
      - run: pnpm security:personal-data-erasure
      - run: pnpm security:personal-data-erasure:check
      - run: node --test scripts/check-personal-data-erasure-evidence.test.mjs
      - run: pnpm security:restore-drill
      - run: pnpm security:restore-drill:check
      - run: pnpm security:restore-drill-evidence:check
      - run: pnpm security:rpo-rto
      - run: pnpm security:rpo-rto:check
      - run: pnpm security:rpo-rto-evidence:check
      - run: pnpm security:retention
      - run: pnpm security:retention:check
      - run: node --test scripts/check-retention-evidence.test.mjs
      - run: pnpm security:secret-inventory:check
      - run: pnpm security:secret-rotation-evidence:check
      - run: pnpm security:service-rpc:check
      - run: pnpm security:storage-backup
      - run: pnpm security:storage-backup:check
      - run: pnpm security:storage-backup-evidence:check
      - run: pnpm security:supabase-config
      - run: pnpm security:supabase-config:check
      - run: pnpm contract:check
      - run: pnpm client:check
      - run: pnpm build
      - run: pnpm security:client-secrets
